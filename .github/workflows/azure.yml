name: Deploy to Azure
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  AZURE_WEBAPP_NAME: adeticket-ff
  AZURE_CLIENT_ID: 28395708-62f0-43af-9320-4eeb93f83e2e
  AZURE_TENANT_ID: eebc63f8-ba15-4204-b127-5b6c929e7c95
  AZURE_SUBSCRIPTION_ID: bd83bca5-9234-4923-b95f-0dc160ec962c
concurrency:
  group: azure-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=moderate
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Configure public Cast and advertising settings
        run: az webapp config appsettings set --resource-group Kayode_IGO --name "$AZURE_WEBAPP_NAME" --settings CAST_APP_ID=0AF8BA4D ADSENSE_CLIENT=ca-pub-2467796901387108 ADSENSE_RULES_SLOT=8774068970 ADS_ENABLED=false ADS_CONSENT_READY=false --output none
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: dist/
